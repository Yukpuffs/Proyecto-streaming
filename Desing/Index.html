<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Proyecto streaming</title>
    <link rel="stylesheet" href="Styles.css">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=DynaPuff:wght@400..700&family=McLaren&display=swap" rel="stylesheet">

</head>
<body class="Wal">
    <div class="container-fluid">
        <div class="row m-3 m-md-5 align-items-center">
            <div class="col-12 col-md-4 text-center text-md-start mb-3 mb-md-0">
                <h1 class="titulo">Proyecto gestión <br> carritos</h1>
            </div>
            <div class="col-12 col-md-8">
                <img src="Img/money.gif" alt="rabbit" class="img-fluid d-block mx-auto mx-md-0" id="gif" width="50" height="50">
            </div>
        </div>

        <div class="row info m-3 m-md-5 g-3">
            <div class="col-12 col-md-6 col-sm-12 border rounded" id="espacio1">
            </div>
            <div class="col-12 col-md-6 col-sm-12 border rounded" id="espacio2">
                <div class="notis rounded m-2 p-2">
                </div>
            </div>

            <div class="col-12 d-grid d-md-flex gap-2 justify-content-md-between m-2">
                <button class="rounded boton btn-sm text-white" id="LoadProd">
                    Start Producer <br> process
                </button>
                <button class="rounded boton btn-sm text-white" id="LoadConsu">
                    Start Consumer <br> process
                </button>
            </div>
        </div>
    </div>
    <script src="main.js"></script>
</body>
</html>
